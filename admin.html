<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Admin — Northlight Archive</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script></head><body>
<header class="site-header"><a class="brand" href="index.html">NORTHLIGHT ARCHIVE<span>PRIVATE ADMIN</span></a><nav><a href="index.html">Store</a><a class="active" href="admin.html">Admin</a></nav></header>
<main class="page admin-page"><div class="admin-top"><div><p class="eyebrow">PRIVATE DASHBOARD</p><h1>Photo Manager</h1></div><button class="button ghost" onclick="signOut()">Log out</button></div>
<p id="appError" class="notice"></p>
<section id="login" class="admin-card" hidden><h2>Sign in</h2><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="button" onclick="signIn()">Sign in</button></section>
<div id="panel" hidden><div class="stats"><div class="stat"><b id="photoStat">0</b><span>PHOTOS</span></div><div class="stat"><b id="salesStat">0</b><span>PAID ORDERS</span></div><div class="stat"><b id="revenueStat">$0.00</b><span>REVENUE</span></div><div class="stat"><b id="visitStat">—</b><span>VISIT ANALYTICS</span></div></div>
<section class="admin-card"><h2>Add photograph</h2><form id="photoForm" onsubmit="event.preventDefault();publishPhoto()"><label>Photograph file<input id="file" type="file" accept="image/*" required></label><div class="form-grid"><label>Title<input id="title" required></label><label>Price (USD)<input id="price" type="number" min="0" step=".01" required></label><label>Category<input id="cat" placeholder="Landscape"></label><label>Tags<input id="tags" placeholder="autumn, lake, nature"></label></div><label>Description<textarea id="desc"></textarea></label><label><input id="published" type="checkbox" checked style="width:auto;display:inline"> Publish immediately</label><button class="button">Publish photograph</button></form></section>
<section class="admin-card"><h2>Your photographs</h2><div id="adminPhotos" class="admin-list"></div></section>
<section class="admin-card"><h2>Orders</h2><div id="orders"></div></section></div></main>
<footer><span>© <span id="year"></span> Northlight Archive</span><a href="admin.html">Private Admin</a></footer></body></html><script>
(async()=>{if(!NA.sb){document.getElementById('appError').textContent='Open js/config.js and add your Supabase URL and anon key.';document.getElementById('login').hidden=false;return}let s=await requireAdmin();if(s)adminRefresh()})()
</script>
